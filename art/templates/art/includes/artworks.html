{% load art_tags %}

{% for artwork in artworks %}
  {% if forloop.first %}
    {% artwork_tag artwork is_lcp=True %}
  {% elif forloop.counter <= 3 %}
    {% artwork_tag artwork %}
  {% else %}
    {% artwork_tag artwork lazy=True %}
  {% endif %}
{% empty %}
  <p class="artwork-list-no-art">
    No art here.
  </p>
{% endfor %}
